project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "materials/**/*.qmd"
    - "!materials/**/exercises/"
    - "!materials/2-workshop2/**/exercise_*.qmd"
    - "!materials/2-workshop2/1-reads-to-counts/analog_activities.qmd"
    - "!archive/"
    - "!archive-src/"

from: markdown+emoji

execute:
  freeze: auto

website:
  title: "Data Science for Biology Workshop Series"
  page-navigation: true
  navbar:
    background: light
    foreground: dark
    right:
      - text: "Get Started"
        href: getting-started.qmd
      - text: "Datasets"
        href: datasets.qmd
      - text: "Resources"
        href: resources.qmd
      - text: "Past Workshops"
        href: past-workshops.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/elsherbini/data-science-for-biology
        aria-label: GitHub
  sidebar:
    style: docked
    align: left
    collapse-level: 2
    contents:
      - section: "<b>2. Multiomics: Microbiome and Host Gene Expression</b>"
        contents:
          - text: "<b>Module 0</b>: Welcome to the Workshop"
            href: materials/2-workshop2/0-welcome/index.qmd
          - text: "<b>Module 1</b>: From Reads to Count Tables"
            href: materials/2-workshop2/1-reads-to-counts/index.qmd
          - text: "<b>Module 2</b>: Count Table Anatomy"
            href: materials/2-workshop2/2-count-table-anatomy/index.qmd
          - text: "<b>Module 3</b>: Distances and Ordination"
            href: materials/2-workshop2/3-ordination/index.qmd
          - text: "<b>Module 4</b>: Differential Testing"
            href: materials/2-workshop2/4-differential/index.qmd
          - text: "<b>Module 5</b>: Sets and Enrichment"
            href: materials/2-workshop2/5-enrichment/index.qmd
          - text: "<b>Module 6</b>: Putting the Two Tables Together"
            href: materials/2-workshop2/6-integration/index.qmd
          - text: "<b>Group Project</b>"
            href: materials/2-workshop2/7-group-project/index.qmd
      - section: "<b>1. Data Science with R and Agentic Coding</b>"
        contents:
          - text: "<b>Module 0</b>: Welcome to the Workshop"
            href: materials/1-workshop1/0-welcome/index.qmd
          - text: "<b>Module 1</b>: Introduction to Agentic Coding"
            href: materials/1-workshop1/1-agentic-coding/index.qmd
          - text: "<b>Module 2</b>: Intro to R, Quarto, and VSCode"
            href: materials/1-workshop1/2-intro-to-r/index.qmd
          - text: "<b>Module 3</b>: Intro to data wrangling and visualization with the tidyverse"
            href: materials/1-workshop1/3-wrangling-and-viz/index.qmd
          - text: "<b>Module 4</b>: More data wrangling and visualization"
            href: materials/1-workshop1/4-more-wrangling-and-viz/index.qmd
          - text: "<b>Module 5</b>: Modelling and Uncertainty"
            href: materials/1-workshop1/5-modeling/index.qmd
          - text: "<b>Module 6</b>: gtsummary and ggpubr for hypothesis testing"
            href: materials/1-workshop1/6-gtsummary-and-ggpubr/index.qmd
          - text: "<b>Group Project</b>"
            href: materials/1-workshop1/7-group-project/index.qmd
          - text: "<b>Mini Modules</b>"
            href: materials/1-workshop1/8-mini-modules/index.qmd
          - text: "<b>Package Cheatsheet</b>"
            href: materials/1-workshop1/package_cheatsheet.qmd
          - text: "<b>After the Workshop</b>"
            href: after-the-workshop.qmd
      - text: "Take the Survey"
        href: "https://docs.google.com/forms/d/e/1FAIpQLSfSZLQYrnIvVjDNNeKpa1sDjvF8ZMiuSgB2m2XO39AP-VgE1Q/viewform"
        icon: box-arrow-up-right
        target: _blank

format:
  html:
    theme: [default, assets/custom.scss]
    toc: false
